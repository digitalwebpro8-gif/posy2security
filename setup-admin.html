
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration administrateur | POSY2SECURITY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#101d32;
  color:#fff
}
.container{
  width:100%;
  max-width:440px;
  padding:32px;
  background:#fff;
  color:#17243a;
  border-radius:14px;
  box-shadow:0 15px 45px #0005
}
h1{font-size:24px;margin:0 0 8px}
p{color:#64748b;line-height:1.5}
label{display:block;margin:17px 0 7px;font-weight:bold}
input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px
}
button{
  width:100%;
  margin-top:24px;
  padding:14px;
  border:0;
  border-radius:7px;
  background:#c69b35;
  color:#101d32;
  font-weight:bold;
  font-size:16px;
  cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
#message{
  margin-top:18px;
  padding:12px;
  border-radius:7px;
  display:none;
  line-height:1.5
}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.note{font-size:12px;margin-top:18px}
</style>
</head>
<body>

<div class="container">
  <h1>POSY2SECURITY</h1>
  <p>Création du premier compte administrateur principal.</p>

  <form id="setupForm">
    <label for="nom">Nom</label>
    <input id="nom" value="Tata Eric" required maxlength="100">

    <label for="email">Adresse e-mail</label>
    <input id="email" type="email"
      value="tataeric048@gmail.com" required>

    <label for="password">Créer un mot de passe</label>
    <input id="password" type="password"
      minlength="12" maxlength="128" required
      autocomplete="new-password">

    <label for="confirm">Confirmer le mot de passe</label>
    <input id="confirm" type="password"
      minlength="12" maxlength="128" required
      autocomplete="new-password">

    <label for="secret">Clé secrète de configuration</label>
    <input id="secret" type="password"
      required autocomplete="off">

    <button id="submitButton" type="submit">
      Créer mon compte administrateur
    </button>
  </form>

  <div id="message" role="status"></div>

  <p class="note">
    Utilise un mot de passe unique d'au moins 12 caractères.
    Ne partage tes identifiants avec personne.
  </p>
</div>

<script>
const form = document.getElementById("setupForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const nom = document.getElementById("nom").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const secret = document.getElementById("secret").value;

  message.style.display = "none";

  if (password !== confirm) {
    message.className = "error";
    message.textContent = "Les deux mots de passe ne correspondent pas.";
    message.style.display = "block";
    return;
  }

  if (password.length < 12) {
    message.className = "error";
    message.textContent = "Le mot de passe doit contenir au moins 12 caractères.";
    message.style.display = "block";
    return;
  }

  button.disabled = true;
  button.textContent = "Création en cours...";

  try {
    const response = await fetch("/api/admin/setup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Admin-Setup-Key": secret
      },
      body: JSON.stringify({nom, email, password})
    });

    const result = await response.json();

    message.className = result.success ? "success" : "error";
    message.textContent = result.message;
    message.style.display = "block";

    if (result.success) {
      form.reset();
      document.getElementById("nom").value = "Tata Eric";
      document.getElementById("email").value = "tataeric048@gmail.com";
      button.textContent = "Compte créé";
    } else {
      button.disabled = false;
      button.textContent = "Créer mon compte administrateur";
    }

  } catch (error) {
    message.className = "error";
    message.textContent = "Impossible de contacter le serveur. Réessaie.";
    message.style.display = "block";
    button.disabled = false;
    button.textContent = "Créer mon compte administrateur";
  }
});
</script>

</body>
</html>
