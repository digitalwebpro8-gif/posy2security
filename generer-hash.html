<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Génération sécurisée du mot de passe</title>
</head>
<body>
  <h2>Générateur d'empreinte POSY2SECURITY</h2>

  <label for="password">Mot de passe administrateur</label>
  <input id="password" type="password" autocomplete="new-password">

  <button id="generate">Générer l'empreinte</button>

  <p id="result"></p>
  <textarea id="hash" rows="5" cols="60" readonly></textarea>
  <button id="copy" hidden>Copier l'empreinte</button>

  <script>
    const generate = document.getElementById("generate");
    const passwordInput = document.getElementById("password");
    const hashOutput = document.getElementById("hash");
    const result = document.getElementById("result");
    const copyButton = document.getElementById("copy");

    function base64(bytes) {
      return btoa(String.fromCharCode(...new Uint8Array(bytes)));
    }

    generate.addEventListener("click", async () => {
      const password = passwordInput.value;

      if (password.length < 12 || password.length > 128) {
        result.textContent = "Le mot de passe doit contenir entre 12 et 128 caractères.";
        return;
      }

      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const key = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveBits"]
        );

        const bits = await crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt,
            iterations: 310000,
            hash: "SHA-256"
          },
          key,
          256
        );

        hashOutput.value =
          `pbkdf2$310000$${base64(salt)}$${base64(bits)}`;

        passwordInput.value = "";
        result.textContent = "Empreinte générée sur cet appareil.";
        copyButton.hidden = false;
      } catch (error) {
        result.textContent = "Erreur lors de la génération. Vérifie que la page utilise HTTPS.";
      }
    });

    copyButton.addEventListener("click", async () => {
      await navigator.clipboard.writeText(hashOutput.value);
      result.textContent = "Empreinte copiée.";
    });
  </script>
</body>
</html>
